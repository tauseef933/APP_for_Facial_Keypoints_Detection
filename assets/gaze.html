<!DOCTYPE HTML>
<html>
<head>
   <title>GazeCloudAPI</title>
   <script src="https://api.gazerecorder.com/GazeCloudAPI.js"></script>
   <style type="text/css">
      body {
         overflow: hidden;
      }
   </style>
   <script type="text/javascript">
      function PlotGaze(GazeData) {
         const screenWidth = window.innerWidth;
         const screenHeight = window.innerHeight;

         const centerX = screenWidth * 6;
         const centerY = screenHeight * 8;

         const leftBoundary = centerX - (screenWidth * 10);
         const rightBoundary = centerX + (screenWidth * 10);
         const topBoundary = centerY - (screenHeight * 10);
         const bottomBoundary = centerY + (screenHeight * 10);

         let direction = '';

         if (GazeData.docX < leftBoundary) {
            direction = 'Not Center';
         } else if (GazeData.docX > rightBoundary) {
            direction = 'Not Center';
         } else if (GazeData.docY < topBoundary) {
            direction = 'Not Center';
         } else if (GazeData.docY > bottomBoundary) {
            direction = 'Not Center';
         } else {
            direction = 'Center';
         }

         console.log(direction);

         document.getElementById("GazeData").innerHTML = "GazeX: " + GazeData.GazeX.toFixed(2) + " GazeY: " + GazeData.GazeY.toFixed(2);
         document.getElementById("HeadPhoseData").innerHTML = "HeadX: " + GazeData.HeadX.toFixed(2) + " HeadY: " + GazeData.HeadY.toFixed(2) + " HeadZ: " + GazeData.HeadZ.toFixed(2);
         document.getElementById("HeadRotData").innerHTML = "Yaw: " + GazeData.HeadYaw.toFixed(2) + " Pitch: " + GazeData.HeadPitch.toFixed(2) + " Roll: " + GazeData.HeadRoll.toFixed(2);

         const x = GazeData.docX;
         const y = GazeData.docY;
         const gaze = document.getElementById("gaze");

         gaze.style.left = (x - gaze.clientWidth / 2) + "px";
         gaze.style.top = (y - gaze.clientHeight / 2) + "px";

         if (GazeData.state !== 0) {
            if (gaze.style.display === 'block') gaze.style.display = 'none';
         } else {
            if (gaze.style.display === 'none') gaze.style.display = 'block';
         }
      }

      window.addEventListener("load", function() {
         GazeCloudAPI.OnCalibrationComplete = function() { console.log('gaze Calibration Complete') }
         GazeCloudAPI.OnCamDenied = function() { console.log('camera access denied') }
         GazeCloudAPI.OnError = function(msg) { console.log('err: ' + msg) }
         GazeCloudAPI.UseClickRecalibration = true;
         GazeCloudAPI.OnResult = PlotGaze;
         
         // Start eye tracking automatically
         GazeCloudAPI.StartEyeTracking();
      });
   </script>
</head>
<body>
   <h1>GazeCloudAPI integration example</h1>
   <div>
      <p>Real-Time Result:</p>
      <p id="GazeData"></p>
      <p id="HeadPhoseData"></p>
      <p id="HeadRotData"></p>
   </div>
   <div id="gaze" style='position: absolute;display:none;width: 100px;height: 100px;border-radius: 50%;border: solid 2px rgba(255, 255,255, .2);box-shadow: 0 0 100px 3px rgba(125, 125,125, .5);pointer-events: none;z-index: 999999'></div>
</body>
</html>
